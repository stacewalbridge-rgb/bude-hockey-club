name: Update England Hockey fixtures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-england-hockey.mjs'
      - '.github/workflows/update-england-hockey.yml'
  schedule:
    - cron: '17 5,17 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Scan England Hockey
        run: node scripts/update-england-hockey.mjs
      - name: Commit changes
        run: |
          git config user.name "Bude HC Fixtures Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/fixtures.json
          git diff --cached --quiet && exit 0
          git commit -m "Auto-update England Hockey fixtures and results"
          git push
