name: Sync club social posts
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
concurrency:
  group: social-post-publication
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch authorised Meta posts
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python scripts/sync_social.py
      - name: Commit feed if changed
        if: always()
        run: |
          git config user.name "bude-hockey-social-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/social-posts.json public/social-media 2>/dev/null || git add public/social-posts.json
          if ! git diff --cached --quiet; then git commit -m "Update club social news feed"; git pull --rebase; git push; fi
